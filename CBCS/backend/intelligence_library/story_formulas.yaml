# CCP Story Formulas — Deployment Tracking + Staleness Detection
# Schema: v3.0 | CCP Layer: Expression (L7)
# Pi Extensions: [MemoryFolder, ContrastiveAnchor]
# PRD Mandate: Add deployment_count + staleness_flag per H10 fix
#
# Each formula now tracks usage frequency via MemoryFolder:
#   deployment_count: int — how many times this formula was used in last 8 weeks
#   staleness_flag: bool — true if deployment_count > 3 (triggers Boredom Ban)
#   last_deployed: timestamp — when this formula was last used
#
# Boredom Ban Rule: If staleness_flag == true, the formula is EXCLUDED from
# dynamic-theme-generator and blueprint-orchestrator selection pools.

formulas:
  - id: 1
    components: ["DHD", "Dreams", "Fears", "Insecurities"]
    persuasion_angles:
      - angle: "Allay Fears"
        description: "Reassure the audience that their dreams are achievable despite their fears and insecurities."
      - angle: "Encourage Dreams"
        description: "Emphasize the value and potential of their dreams, encouraging them to move past their fears and insecurities."
      - angle: "Justify Failures"
        description: "Explain that facing fears and insecurities is a common part of pursuing dreams and that setbacks are just learning experiences."
      - angle: "Confirm Suspicions"
        description: "Validate their fears and insecurities as legitimate but show how they can still overcome them to achieve their dreams."
      - angle: "Throw Rocks at Their Enemies"
        description: "Identify sources of fear and insecurity as external obstacles, encouraging the audience to confront and overcome them."
      - angle: "Problem Amplification"
        description: "Highlight the consequences of letting fears and insecurities prevent them from pursuing their dreams, creating a sense of urgency."
      - angle: "Favorable Evidence"
        description: "Present stories of people who have achieved their dreams despite similar fears and insecurities."
      - angle: "Black and White Philosophy"
        description: "Frame the choice as either succumbing to fears and insecurities or striving for their dreams."
      - angle: "The Challenger"
        description: "Challenge the audience to view their fears and insecurities as barriers they can overcome on the way to achieving their dreams."

  - id: 2
    components: ["DHD", "Dreams", "Fears", "Suspicions"]
