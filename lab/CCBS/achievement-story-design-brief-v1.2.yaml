        criticality: "IMPORTANT"
      - id: "DEP-LIB-004"
        name: "Persuasive Angles"
        file: "persuasive_angles.json"
        criticality: "IMPORTANT"
      - id: "DEP-LIB-005"
        name: "Cognitive Distortion Definitions"
        file: "cognitive_distortion_definitions.yaml"
        criticality: "IMPORTANT"
      - id: "DEP-LIB-006"
        name: "Identity Threat Taxonomy"
        file: "identity_threat_taxonomy.yaml"
        criticality: "IMPORTANT"
      - id: "DEP-LIB-007"
        name: "SDT Markers"
        file: "sdt_markers.yaml"
        criticality: "IMPORTANT"
