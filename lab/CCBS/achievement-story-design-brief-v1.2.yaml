# ═══════════════════════════════════════════════════════════
# BLOCK A — STRUCTURAL INVARIANTS
# Pre-filled. Archetype-invariant. Never changes per compilation.
# References: Reasoning Module Taxonomy + Adapter Registry v2.0
# ═══════════════════════════════════════════════════════════

block_a:

  field_1_intent: >
    Surfaces the coach's authenticated triumph-over-adversity narrative
    to demonstrate that a specific result is achievable through a specific
    mechanism — producing evidence-based aspiration rather than
    instructional advice. Exists because social proof delivered through
    embodied experience bypasses the skepticism that data alone cannot move.
    Orchestrator routing value: load when batch strategy signals
    authority-building, aspiration, or social proof function AND
    the coach's authenticated emotional state registers pride,
    vindication, or earned certainty.

  field_4_trigger: >
    Orchestrator archetype selection resolves to ARCH-STORY-01
    following Trigger-First activation (DEP-ENG-005 Authentication
    Certificate passes) when authenticated emotional state tags read
    TTT-03 to TTT-06 range AND batch strategy function = authority
    or aspiration. Flag for human review if TTT-07 or above.

  field_6_action: >
    Compress authenticated triumph experience into a 5-phase narrative
    arc that makes the result feel inevitable in retrospect and
    replicable in prospect. Each phase draws from its pre-addressed
    CRAL moment finding via DEP-ENG-021. Research is resolved upstream.
    Generation is execution, not processing.

  field_7_method:
    # ── v1.2 CHANGE ─────────────────────────────────────────
    # Each arc phase now carries a cral_source field identifying
    # which CRAL moment finding pre-addresses intelligence for it.
    # The use_at mapping is formally specified in
    # block_b.field_5b_cral_finding_map.
    # The Assembler calls DEP-ENG-021[moment_id] at the phase
    # where use_at = this phase, not at general generation time.
    # ─────────────────────────────────────────────────────────
    arc_phases:
      - phase: "1 — Stakes"
        cral_source: "M2_BELIEVABLE + M3_UNDENIABLE"
        rule: >
          Name the specific cost of failure before any result is
          mentioned. Audience must feel what losing means before
          they can feel what winning means. One sentence maximum.
          In v1.2: Stakes are no longer synthesized or derived
          solely from DEP-ENG-010 SoC Batch. M2_BELIEVABLE provides
          the named, verifiable mechanism instance that makes the
          stakes real. M3_UNDENIABLE provides the audience's
          specific prediction gap — what they believe about this
          mechanism that is measurably wrong — so Stakes land at
          exactly the cognitive register where the audience is
          currently wrong rather than at a generic difficulty level.
          Grounded in DEP-LIB-006 Identity Threat Taxonomy.
        v1_1_source: "DEP-ENG-010 SoC Batch only"
        v1_2_source: "DEP-ENG-021[M2_BELIEVABLE] + DEP-ENG-021[M3_UNDENIABLE] + DEP-ENG-010 SoC Batch (voice authenticity)"

      - phase: "2 — Mechanism"
        cral_source: "M4_RESONANT"
        rule: >
          Name the single transferable principle the coach understood
          or did that others weren't. Not effort. Not mindset.
          A specific lever. Grounded in HOW not THAT.
          In v1.2: The mechanism is no longer extracted from
          DEP-ENG-010 candidate passages alone. M4_RESONANT delivers
          a complete narrative unit — named protagonist, status details,
          documented moment of contact with the mechanism — built to
          the exact emotional architecture this archetype requires.
          The mechanism candidate extracted from SoC is cross-referenced
          against M4's narrative unit. If they are congruent, M4's
          structural precision upgrades the SoC material. If they
          conflict, the conflict is flagged per Builder Engine Step 3.5.
        v1_1_source: "DEP-ENG-010 SoC Batch candidate passages"
        v1_2_source: "DEP-ENG-021[M4_RESONANT] cross-referenced with DEP-ENG-010"

      - phase: "3 — Turn"
        cral_source: "M5_SURPRISING"
        rule: >
          The exact frame where the mechanism produced a visible result.
          Sensory-specific. A date, a conversation, a number on a screen.
          Not a period of time. One frame.
          In v1.2: M5_SURPRISING is the pre-researched finding that
          violates the audience's surface prediction at the exact
          calibration level of optimal incongruity — enough structure
          to be taken seriously, enough prediction error to demand
          revision. The Turn phase is where this finding lands.
          The counter-intuitive detail that should not have happened
          according to the audience's prior belief IS the Turn.
          M5 was specifically researched to produce maximum synaptic
          plasticity at the moment the mechanism's result becomes
          visible. The Turn is no longer reconstructed from SoC —
          it is pre-addressed from the intelligence layer.
        v1_1_source: "DEP-ENG-010 SoC Batch — reconstructed"
        v1_2_source: "DEP-ENG-021[M5_SURPRISING]"

      - phase: "4 — Result"
        cral_source: "M6_IRREFUTABLE"
        rule: >
          Hard specificity. Falsifiable. At least one number, timeline,
          or named observable change. Validated against
          DEP-ENG-005 Authentication Certificate.
          In v1.2: M6_IRREFUTABLE operates at maximum source proximity
          — the enemy's own document, the internal admission, the
          filing that closes the deniability gap. Where v1.1 required
          the Result to be validated against DEP-ENG-005, v1.2 requires
          the Result to carry M6's irrefutable evidence as its
          evidentiary anchor. The audience does not just believe the
          Result — they encounter evidence they cannot unknow.
          If no falsifiable result exists in source material AND
          M6 cannot produce an irrefutable finding for this mechanism →
          trigger graceful degradation (see field_9_structural_constraints).
        v1_1_source: "DEP-ENG-010 + DEP-ENG-005 validation"
        v1_2_source: "DEP-ENG-021[M6_IRREFUTABLE] + DEP-ENG-005 validation"

      - phase: "5 — Implication"
        cral_source: "M7_RELATABLE"
        rule: >
          Structural parallel to audience's specific situation.
          In v1.1: Loaded from DEP-ENG-006 Context Premise L3 layer.
          Not generic inspiration. The parallel must name the
          audience's exact structural equivalent of the coach's situation.
          In v1.2: M7_RELATABLE delivers the tribal recognition anchor
          — the specific named person from inside the tribe whose
          documented testimony uses the tribe's own vernacular to
          describe the exact structural position the audience occupies.
          The Implication no longer constructs a generic parallel from
          L3 data. It deploys M7's pre-researched, frequency-matched,
          vernacular-precise human evidence. The audience does not
          feel described. They feel seen.
          Portelli quality gate applies: passes only when the finding
          achieves tribal recognition, not when it achieves factual
          accuracy. DEP-ENG-006 L3 vocabulary remains the constraint
          on language register. M7 supplies the human evidence.
        v1_1_source: "DEP-ENG-006 Context Premise L3 layer"
        v1_2_source: "DEP-ENG-021[M7_RELATABLE] constrained by DEP-ENG-006 L3 vocabulary"

    structural_laws:
      - "Mechanism precedes result. ALWAYS."
      - "Stakes ceiling = emotional ceiling of the Turn phase. Weak stakes = weak Turn."
      - "Single mechanism per piece. Multiple mechanisms = dilution."
      - "Implication must use tribal language from DEP-ENG-007."
      # v1.2 additions:
      - "CRAL moments are pre-addressed. The Assembler calls DEP-ENG-021[moment_id] at phase entry, not at general generation time."
      - "M2 and M3 must arrive before Stakes construction begins. Orchestrator enforces this via dependency firing map."
      - "If DEP-ENG-021 is absent or incomplete, fall back to v1.1 source chain AND flag output as CRAL_DEGRADED."

  field_8_structural_modules:
    # ── REASONING MODULES ──────────────────────────────────
    # Core DNA preserved. Ecological adaptation MANDATORY.
    # v1.2: Distillation Funnel Cross-Input Collision updated
    # to receive pre-processed CRAL signals. The collision
    # is now between CRAL-delivered intelligence and SoC voice
    # authenticity — not between raw research and raw voice.

    - module_species: "Distillation Funnel"
      adapter: "distillation-funnel-adapter"
      ecological_adaptation:
        saturation: >
          Cross-Input Collision variant — v1.2 update.
          In v1.1: collision between DEP-ENG-003 Emotional DNA
          appraisal sequence and DEP-ENG-006 Context Premise L3 pain.
          In v1.2: collision between DEP-ENG-021 CRAL Finding Index
          (pre-processed, frequency-matched intelligence) and
          DEP-ENG-003 Emotional DNA (coach's authentic voice path).
          The Funnel no longer processes raw research. It receives
          pre-distilled signal from seven CRAL moments and fuses it
          with the coach's emotional architecture. Precision doubles.
          Processing load at generation time drops.
        classification: >
          3 signal categories for Achievement Story domain.
          v1.2 CRAL moment mapping:
          T = Tension signals (Stakes phase) → M2_BELIEVABLE + M3_UNDENIABLE
          V = Vulnerability signals (Mechanism phase) → M4_RESONANT narrative unit
          R = Recognition signals (Implication phase) → M7_RELATABLE tribal anchor
        compression: >
          Collapse Test variant — unchanged from v1.1.
          Test: "If I remove the Mechanism from this narrative, does the
          Result become unbelievable?" If yes: compressed. If no:
          mechanism is decorative — restructure.
          v1.2 addition: Run same Collapse Test against M5_SURPRISING.
          "If I remove the Turn finding, does the Result feel earned?"
          If no: M5 finding is not integrated — retrieve and deploy.
        gate: >
          First-Party Vulnerability Enforcement — v1.2 update.
          Stakes phase MUST be derived from DEP-ENG-010 SoC Batch
          for voice authenticity. M2 and M3 CRAL findings provide
          the evidentiary layer. Neither substitutes for the other.
          SoC = the coach's authentic voice about the stakes.
          CRAL = the verified external reality that makes those stakes
          undeniable to the audience. Both must be present.

    - module_species: "Contrastive Anchor"
      adapter: "contrastive-anchor-adapter"
      ecological_adaptation:
        archetypal_failure_mode: >
          Generic AI version of Achievement Story =
          Effort narrative: "I worked incredibly hard and never gave up.
          After months of struggle, I finally achieved my goal.
          You can do it too if you believe in yourself."
          This fails because: (1) mechanism is non-transferable,
          (2) result is impressionistic, (3) implication is generic.
          v1.2 addition: The pre-CRAL failure mode also includes
          research-rich but frequency-mismatched content — factually
          accurate findings delivered at the wrong emotional register
          for the audience's mood state. CRAL's mood-specific
          research architecture eliminates this failure mode at source.
        surface_success_failure: >
          Result + mechanism present but Stakes are generic and Turn
          is a period. Passes a quick scan but fails falsifiability.
          v1.2 addition: CRAL-partial failure — M2 present but M3
          absent means Stakes confirm the mechanism but do not locate
          the audience's specific prediction error. The Stakes land
          at a generic level of difficulty, not at the exact cognitive
          register where the audience is measurably wrong.
        steering_instruction: >
          The generated piece must have a mechanism a different person
          could apply in a different domain. Test: can a stranger read
          the mechanism and know what to do differently tomorrow?
          v1.2 addition: The implication must pass the tribal
          recognition test — not just describe the parallel but
          deploy M7's vernacular-precise human evidence. If the
          audience member reads the Implication and thinks "that is
          how we talk about this" the test passes.

    - module_species: "MCDA"
      adapter: "deliberation-adapter"
      ecological_adaptation:
        evaluation_domain: "Mechanism quality scoring"
        critic_rules:
          - "Is the mechanism transferable to someone outside the coach's specific situation?"
          - "Is the Turn a single identifiable frame or a vague period?"
          - "Does the Result contain at least one falsifiable data point?"
          - "Does the Implication use L3 tribal language or generic inspiration?"
          - "Does the Stakes phase name a cost or just label a difficulty?"
          # v1.2 additions:
          - "Does the Stakes phase carry M2's named mechanism instance or is it synthesized?"
          - "Does the Turn deploy M5_SURPRISING or is it reconstructed from SoC?"
          - "Does the Implication deploy M7_RELATABLE or is it constructed from L3 data alone?"
          - "Are all seven CRAL moment findings present in the finding index for this session?"
        synthesis_mechanism: "REVISE_FLAGGED_ONLY"

    # ── MANDATORY EXECUTION ADAPTERS ──────────────────────
    - adapter: "irevc-adapter"
      note: "Mandatory. Maps this brief's 11 fields into I-R-E-V-C execution protocol."

    - adapter: "graceful-degradation-adapter"
      note: "Mandatory. Defines failure payload and input criticality tiers."

    # v1.2 ADDITION ─────────────────────────────────────────
    - adapter: "cral-finding-router-adapter"
      status: "REGISTERED — Adapter Registry v2.0"
      note: >
        Mandatory in v1.2. Routes DEP-ENG-021 finding index to the
        correct arc phase at assembly time. Fires at the start of
        each phase, retrieves the pre-addressed moment finding, and
        injects it as a structured constraint before the section
        assembler runs. Prevents the generation step from processing
        research — it only executes against pre-addressed signal.
      routing_map:
        Stakes_phase: ["M2_BELIEVABLE", "M3_UNDENIABLE"]
        Mechanism_phase: ["M4_RESONANT"]
        Turn_phase: ["M5_SURPRISING"]
        Result_phase: ["M6_IRREFUTABLE"]
        Implication_phase: ["M7_RELATABLE"]
      degradation_behavior: >
        If DEP-ENG-021 is absent or a specific moment finding is
        missing: flag the phase as CRAL_DEGRADED, fall back to v1.1
        source chain for that phase only, continue assembly, log
        degradation in assembly_report.json.
    # ────────────────────────────────────────────────────────

  field_9_structural_constraints:
    universal_rules:
      - "NEVER open with the result. Stakes land before Turn. No exceptions."
      - "NEVER use effort as the mechanism. Effort is not transferable."
      - "NEVER generalize the implication. Must name audience's specific parallel."
      - "NEVER include more than one mechanism. Multiple = dilution."
      - "NEVER allow Turn to be abstract. One frame only."
      - "NEVER synthesize Stakes. Must come from DEP-ENG-010 source material."
      # v1.2 additions:
      - "NEVER run research inside generation. All research intelligence arrives pre-addressed via DEP-ENG-021."
      - "NEVER substitute CRAL findings for SoC voice material. CRAL = evidentiary layer. SoC = authentic voice. Both mandatory."
      - "NEVER deploy M7_RELATABLE without confirming tribal recognition test. Vernacular precision is the quality gate, not factual accuracy."
    graceful_degradation_map:
      - input: "DEP-ENG-010 SoC Batch"
        criticality: "CRITICAL — Halt if absent. No fabrication."
      - input: "DEP-ENG-003 Emotional DNA"
        criticality: "CRITICAL — Halt if absent."
      - input: "DEP-ENG-006 Context Premise"
        criticality: "CRITICAL — Implication phase vocabulary constraint cannot load without L3 data."
      - input: "DEP-ENG-007 Tribal Terms"
        criticality: "IMPORTANT — Degrade to standard language if absent. Flag output."
      - input: "DEP-ENG-004 Negative Space"
        criticality: "CRITICAL — Load first before any generation begins."
      # v1.2 additions:
      - input: "DEP-ENG-021 CRAL Finding Index"
        criticality: >
          CRITICAL for v1.2 architecture. If absent: degrade to v1.1
          source chain, flag output as CRAL_DEGRADED, log in
          assembly_report.json. Do not halt — assembly continues
          with reduced intelligence quality. Operator alert required.
      - input: "DEP-ENG-021[M2_BELIEVABLE]"
        criticality: "HIGH — Stakes phase degrades to SoC-only if absent. Flag."
      - input: "DEP-ENG-021[M3_UNDENIABLE]"
        criticality: "HIGH — Prediction gap layer absent. Stakes land at generic difficulty level. Flag."
      - input: "DEP-ENG-021[M4_RESONANT]"
        criticality: "HIGH — Mechanism phase loses narrative unit. Flag."
      - input: "DEP-ENG-021[M5_SURPRISING]"
        criticality: "HIGH — Turn loses counter-intuitive specificity. Flag."
      - input: "DEP-ENG-021[M6_IRREFUTABLE]"
        criticality: "HIGH — Result loses irrefutable evidence anchor. Flag."
      - input: "DEP-ENG-021[M7_RELATABLE]"
        criticality: "HIGH — Implication loses tribal recognition anchor. Degrades to L3 construction. Flag."
    failure_payload: >
      If DEP-ENG-010 contains no falsifiable result metric:
      {"status": "blocked", "reason": "no_falsifiable_result",
      "recovery": "return_to_elicitation",
      "instruction": "Request specific metric from coach via DEP-ENG-013 Provocation Questions"}

  field_11_structural_success_criteria:
    gates:
      - id: "SG-01"
        source: "Distillation Funnel Gate"
        check: "Stakes derived from authenticated SoC, not synthesized."
        pass: "Stakes quote traceable to DEP-ENG-010 source."
        fail: "Stakes are generic description not traceable to source material."
      - id: "SG-02"
        source: "Contrastive Anchor test"
        check: "Mechanism is transferable to a stranger in a different domain."
        pass: "Mechanism names a principle, approach, or insight applicable outside coach's context."
        fail: "Mechanism is a personal trait (mindset, determination, belief)."
      - id: "SG-03"
        source: "MCDA Critic"
        check: "Turn is a single identifiable frame."
        pass: "Turn references date, conversation, decision, specific observation."
        fail: "Turn described as gradual process or period of time."
      - id: "SG-04"
        source: "Authentication Certificate DEP-ENG-005"
        check: "Result contains at least one falsifiable data point."
        pass: "Number, timeline, named outcome, observable binary change."
        fail: "Result impressionistic ('everything changed', 'life was different')."
      - id: "SG-05"
        source: "Context Premise DEP-ENG-006 + Tribal Terms DEP-ENG-007"
        check: "Implication names audience's structural parallel using tribal language."
        pass: "Parallel is structural and uses L3 vocabulary from tribe_soul.json."
        fail: "Generic inspiration close without specific parallel."
      # v1.2 additions:
      - id: "SG-06"
        source: "CRAL Finding Router Adapter — v1.2"
        check: "M2_BELIEVABLE finding present and deployed in Stakes phase."
        pass: "Stakes phase contains named, verifiable mechanism instance from M2."
        fail: "Stakes phase synthesized without M2 anchor. CRAL_DEGRADED logged."
      - id: "SG-07"
        source: "CRAL Finding Router Adapter — v1.2"
        check: "M7_RELATABLE finding passes tribal recognition test."
        pass: >
          Implication deploys M7 vernacular-precise human evidence.
          A tribe member reading the Implication would recognize the
          language as their own internal language about their own life.
        fail: >
          Implication constructs a generic parallel without M7 anchor.
          Factually accurate but does not achieve tribal recognition.
          Partial — flag, do not block.
      - id: "SG-08"
        source: "Builder Engine Step 3.5 — Conflict Detection — v1.2"
        check: "No unresolved conflicts between CRAL moment findings and SoC source material."
        pass: "CRAL findings and SoC material are congruent or conflict was resolved per Step 3.5 logic."
        fail: "Unresolved conflict between M6_IRREFUTABLE and DEP-ENG-005 Authentication Certificate. Block."

