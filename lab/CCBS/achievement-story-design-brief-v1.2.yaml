        criticality: "CRITICAL"
        load_order: "FIRST — Negative Space before positive DNA"
      - id: "DEP-ENG-002"
        name: "Voice DNA SPR (3-Layer)"
        file: "coach_soul.json → voice_dna"
        criticality: "CRITICAL"
      - id: "DEP-ENG-004"
        name: "Negative Space Object"
        file: "coach_soul.json → negative_space"
        criticality: "CRITICAL"
        load_order: "ABSOLUTE FIRST before any generation constraint loads"
      - id: "DEP-ENG-007"
        name: "Audience Tribal Terms"
        file: "tribe_soul.json"
        criticality: "IMPORTANT"
      - id: "DEP-ENG-001"
        name: "Structural Congruence Point"
