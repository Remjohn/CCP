        criticality: "CRITICAL — Primary voice source. No SoC = no authentic Stakes."
      - id: "DEP-ENG-005"
        name: "Authentication Certificate"
        file: "Stage 4 Trigger Engine output"
        criticality: "CRITICAL — Must pass before generation begins."
      - id: "DEP-ENG-016"
        name: "Psychological Routing Brief"
        file: "psych_routing_brief.json"
        criticality: "CRITICAL — REGISTERED in Dependency Registry v4.0."
        status: "REGISTERED"
      - id: "DEP-ENG-017"
        name: "Audience Maturity Profile"
        file: "audience_maturity.json"
        criticality: "IMPORTANT — REGISTERED in Dependency Registry v4.0."
        status: "REGISTERED"
      - id: "DEP-ENG-018"
        name: "Mood Context Map"
        file: "mood_context_map.json"
        criticality: "IMPORTANT — REGISTERED in Dependency Registry v4.0."
        status: "REGISTERED"
      # v1.2 ADDITION ─────────────────────────────────────────
      - id: "DEP-ENG-021"
        name: "CRAL Finding Index"
        file: "cral_finding_index.json"
        criticality: "CRITICAL in v1.2 architecture."
        status: "REGISTERED — Dependency Registry v4.0"
        structure: >
          Seven finding objects keyed by moment_id.
          Each object: { finding, register, use_at, verifiability_citation,
          human_evidence: { name, source, cultural_proximity } }
          M1_RELEVANT, M2_BELIEVABLE, M3_UNDENIABLE, M4_RESONANT,
          M5_SURPRISING, M6_IRREFUTABLE, M7_RELATABLE
        degradation: >
          If absent: flag as CRAL_DEGRADED per phase, fall back to v1.1
          source chain per phase, continue assembly. Do not halt.
      # ──────────────────────────────────────────────────────
    tier_3_archive:
      - id: "DEP-ENG-019"
        name: "Session Transcript Intelligence"
        file: "transcript_intel.json"
        criticality: "IMPORTANT — Context Premise Output 3 (Live Psychometric Feed)."
        status: "REGISTERED"
      - id: "DEP-ENG-020"
        name: "Fingerprint Archive Index"
        file: "fingerprint_archive.json"
        criticality: "IMPORTANT — All compiled skills register here."
        status: "REGISTERED"
      # v1.2 ADDITION ─────────────────────────────────────────
      - id: "DEP-ENG-022"
        name: "CRAL Session Research Plan"
        file: "cral_session_plan.json"
        criticality: "IMPORTANT — Audit trail. Links finding index to Orchestrator firing map."
        status: "REGISTERED — Dependency Registry v4.0"
        note: >
          Used by Fingerprint Archive to link every content output to
          its specific research session. Enables CRAL quality scoring
          per production cycle. Required for Standing Trigger
          Intelligence library accumulation.
      # ──────────────────────────────────────────────────────

  # v1.2 ADDITION ─────────────────────────────────────────────
  field_5b_cral_finding_map:
    # Explicit use_at address for each CRAL moment.
    # The cral-finding-router-adapter reads this map at assembly time
    # to route each finding to the correct arc phase.
    # This is the architectural contract between CRAL and the Assembler.
    description: >
      Maps seven CRAL moment findings to the five arc phases of
      Achievement Story. The Assembler calls DEP-ENG-021[moment_id]
      at phase entry per this map. Research arrives pre-addressed.
      Generation executes against pre-addressed signal.
    mapping:
      - moment_id: "M1_RELEVANT"
        use_at: "pre_assembly_context"
        arc_phase: "none — fires at intake, shapes Orchestrator brief quality"
        function: >
          Cultural NOW for this coach in this tribal moment.
          Informs the Telegram bot intake questions before
          voice note elicitation. Shapes trigger activation quality.
          Does not map to an arc phase but upgrades all downstream
          phases by producing a higher-quality trigger profile.
      - moment_id: "M2_BELIEVABLE"
        use_at: "Stakes_phase"
        arc_phase: "1 — Stakes"
        function: >
          Named, verifiable, unchallengeable mechanism instance.
          The external reality that makes the coach's stakes real.
          The precision journalism finding — specific named entity,
          documented decision, verifiable date, internal industry term.
      - moment_id: "M3_UNDENIABLE"
        use_at: "Stakes_phase"
        arc_phase: "1 — Stakes"
        function: >
          Audience prediction gap at this mood state.
          What the audience in this specific arousal state currently
          believes about the mechanism that is measurably wrong.
          Stakes land at the exact cognitive register of the error.
      - moment_id: "M4_RESONANT"
        use_at: "Mechanism_phase"
        arc_phase: "2 — Mechanism"
        function: >
          Complete narrative unit — named protagonist, status details,
          documented moment of contact with the mechanism, internal
          shift, outcome. Built to this archetype's emotional structure.
          The mechanism is not extracted from SoC alone — it is
          delivered as a pre-structured narrative unit.
      - moment_id: "M5_SURPRISING"
        use_at: "Turn_phase"
        arc_phase: "3 — Turn"
        function: >
          Counter-intuitive finding at optimal incongruity level.
          Violates the audience's specific held belief about the
          mechanism at calibrated prediction error.
          This IS the Turn frame — the single moment where the
          mechanism's result should not have happened according
          to prior belief, and did.
      - moment_id: "M6_IRREFUTABLE"
        use_at: "Result_phase"
        arc_phase: "4 — Result"
        function: >
          Maximum source proximity evidence — enemy's own document,
          internal admission, or filing that closes deniability gap.
          The audience does not just believe the Result.
          They cannot unknow it after M6 lands.
      - moment_id: "M7_RELATABLE"
        use_at: "Implication_phase"
        arc_phase: "5 — Implication"
        function: >
          Tribal recognition anchor — named person from inside the
          tribe, vernacular-precise, whose documented testimony
          uses the tribe's own internal language.
          The Implication is no longer constructed — it is deployed.
          Quality gate: tribal recognition, not factual accuracy.
  # ────────────────────────────────────────────────────────────

  field_8_psychological_modules:
    # ── PSYCHOLOGICAL ADAPTERS ──
    # v1.2: All three adapters REGISTERED in Adapter Registry v2.0.
    # Status changed from PROPOSED to REGISTERED.
    # Inline logic encoding in field_9 is now superseded by
    # formal adapter specifications in the registry.

    - adapter: "psych-routing-adapter"
      status: "REGISTERED — Adapter Registry v2.0"
      instantiated_with:
        mood_state: ""            # from field_3_context
        arousal_direction: ""
        regulatory_frame: ""
        semantic_affinity_risk: ""
      note: >
        No longer encoded inline in field_9.
        Full specification in Adapter Registry v2.0.
        Loads at Tier 1 Mandatory Adapter execution.

    - adapter: "payload-masking-adapter"
      status: "REGISTERED — Adapter Registry v2.0"
      instantiated_with:
        mood_state: ""
        archetype_id: "ARCH-STORY-01"
      masking_instructions_by_mode:
        Processing: >
          No masking. Payload IS the content.
          Achievement Story in Processing Mode delivers mechanism
          and implication as direct psychological truth.
          M6_IRREFUTABLE lands as explicit payload anchor.
        Escape: >
          Mechanism and implication must arrive through the vehicle's
          natural comedic or narrative resolution. The L3 truth is
          subtext. The story opens as entertainment. Truth is the punchline.
          Semantic Affinity Guard MANDATORY — check against DEP-PROTO-011.
          M5_SURPRISING operates as the comedic or narrative turn.
          M6_IRREFUTABLE is embedded in resolution, not stated.
        Discovery: >
          Stakes phase opens as counter-intuitive historical or
          scientific fact. M5_SURPRISING drives the hook.
          Mechanism and implication embedded in the resolution.
          Audience feels smart first. M7_RELATABLE lands after
          intellectual reward — recognition follows competence.
        Status: >
          Mechanism encoded as comparison signal — what the winner
          understood that others didn't. M4_RESONANT protagonist
          is a status peer or aspirational status reference.
          Implication framed as identity-defining insight.
          M7_RELATABLE must be a high-status tribal member.
          Never stated as lesson.

    - adapter: "audience-maturity-adapter"
      status: "REGISTERED — Adapter Registry v2.0"
      instantiated_with:
        audience_cohort: ""       # from field_3_context
      depth_permission_map:
        new: >
          Surface depth only. Stakes stay relatable not existential.
          Implication is aspirational not confrontational.
          CRAL: M3_UNDENIABLE uses heuristic-level prediction gap.
          M7_RELATABLE uses aspirational tribal figure, not insider.
        developing: >
          Mid depth permitted. Mechanism can carry philosophical weight.
          Implication can include mild confrontation of current approach.
          CRAL: Full seven-moment finding index deployed.
        loyal: >
          Full depth. Achievement Story can activate TMT Worldview
          Construction function. tmt_function = worldview_construction
          valid only for loyal cohort.
          CRAL: M6_IRREFUTABLE may carry maximum source proximity
          evidence. M3_UNDENIABLE may target System 2 prediction errors.

  field_9_voice_constraints:
    # ── From Coach Profile (loaded from DEP-ENG-004 Negative Space) ──
    coach_specific:
      forbidden_vocabulary: []    # populated from coach_soul.json
      forbidden_tones: []
      forbidden_rhetorical_moves: []

    # ── Semantic Affinity Guard (DEP-PROTO-011 — REGISTERED v4.0) ──
    semantic_affinity_guard:
      status: "REGISTERED — DEP-PROTO-011"
      rule: >
        Cross-reference piece's content domain against
        active L3 pain domain in DEP-ENG-006 Context Premise.
      action_by_risk:
        low: "Proceed."
        medium: "Flag for review. Human override required for Escape Mode."
        high: >
          BLOCK if mood_state = Escape.
          PERMIT if mood_state = Processing.
          Achievement Story with high semantic affinity must be routed
          to Processing Mode only.

    # ── Psychological Routing Constraints ──
    # v1.2: Formally delegated to psych-routing-adapter (REGISTERED).
    # Inline encoding below retained as human-readable reference only.
    # The adapter specification in Adapter Registry v2.0 is authoritative.
    psychological_routing_constraints:
      note: >
        Below is human-readable reference. psych-routing-adapter
        (REGISTERED) is the authoritative execution specification.
      regulatory_frame_hook_rule: >
        IF regulatory_frame = promotion:
          Hook leads with what becomes possible.
        IF regulatory_frame = prevention:
          Hook leads with what was at risk of being lost.
          Stakes front-loaded. Result arrives as relief not celebration.
      arousal_pacing_rule: >
        IF arousal_direction = raises:
          Sentence rhythm shortens across the arc.
          Turn phase = maximum compression. One sentence maximum.
        IF arousal_direction = lowers:
          Empathy markers open before mechanism.
          Stakes validated before challenged. Rhythm lengthens.
      sdt_alignment_rule: >
        IF sdt_need_primary = relatedness: Implication closes on shared human experience.
        IF sdt_need_primary = competence: Mechanism is emotional center. Audience leaves with a tool.
        IF sdt_need_primary = autonomy: Implication frames path as identity signal not instruction.

  field_10_output_artifact:
    schema_ref: "DEP-ENG-015"
    file_path_pattern: >
      outputs/ccf/scripts/{coach_id}/{YYYYMMDD}-achievement-story-
      {mood_state}-{regulatory_frame}.md
    failure_path: >
      outputs/ccf/scripts/{coach_id}/failed/{YYYYMMDD}-achievement-story-BLOCKED.json
    procedural_log: >
      Every output must include a structured reasoning log documenting:
      (1) Which SoC passage the Stakes were derived from
      (2) What mechanism was identified and why it was selected
      (3) Which L3 parallel was matched in the Implication phase
      (4) Semantic affinity risk level and Guard outcome
      (5) Any Critic Subagent overrides triggered
      [v1.2 additions:]
      (6) CRAL session_id and coverage_status (COMPLETE | PARTIAL | ABSENT)
      (7) Which CRAL moment findings were deployed and which phases
          fell back to v1.1 source chain (CRAL_DEGRADED phases)
      (8) Builder Engine Step 3.5 conflict detection result —
          any CRAL-vs-SoC conflicts found and how resolved

  field_11_psychological_success_criteria:
    gates:
      - id: "PG-01"
        applies_when: "mood_state = Escape"
        check: "Vehicle works independently of L3 payload."
        pass: "Piece is entertaining/funny without the mechanism landing."
        fail: "Vehicle only makes sense as a delivery mechanism."
      - id: "PG-02"
        applies_when: "mood_state = Escape"
        check: "Semantic Affinity Guard cleared."
        pass: "Content domain not identical to active L3 pain domain."
        fail: "BLOCKED — mirrors active stress domain."
      - id: "PG-03"
        applies_when: "mood_state = Discovery"
        check: "Hook delivers genuine cognitive reward before payload."
        pass: "Counter-intuitive entry point is surprising on its own terms."
        fail: "Entry point is a pretext."
      - id: "PG-04"
        applies_when: "audience_cohort = new"
        check: "Depth stays within surface permission level."
        pass: "No existential weight in Implication. Aspirational close."
        fail: "TMT Worldview Construction active for new audience. Block."
      - id: "PG-05"
        applies_when: "tmt_function = worldview_construction"
        check: "Audience cohort is loyal."
        pass: "Cohort = loyal. Deep depth permitted."
        fail: "Cohort = new or developing. Downgrade to insight_delivery."
      - id: "PG-06"
        check: "SDT need satisfied matches field_3_context.sdt_need_primary."
        ref: "DEP-LIB-007 SDT Markers"
        pass: "Dominant SDT signal in output matches declared primary need."
        fail: "Output satisfies different need than declared."
    sdt_alignment_gate:
      ref: "DEP-LIB-007"

# ═══════════════════════════════════════════════════════════
# BLOCK C — COMPILATION VALIDATION GATE
# Run by CCSB Skill Assembler Agent before Phase 2 begins.
# v1.2: Two new gates added. Builder Engine Step 3.5 reference added.
# ═══════════════════════════════════════════════════════════

compilation_validation:

  required_block_b_fields:
    - field: "field_2_target.output_format"
      validation: "must be one of: carousel | video_script | long_form_post | tweet_thread"
    - field: "field_3_context.coach_id"
      validation: "must resolve to populated coach_soul.json"
    - field: "field_3_context.mood_state"
      validation: "must be one of: Processing | Escape | Discovery | Status"
    - field: "field_3_context.regulatory_frame"
      validation: "must be one of: promotion | prevention"
    - field: "field_3_context.tmt_function"
      validation: "must be one of: insight_delivery | worldview_construction | none"
    - field: "field_3_context.audience_cohort"
      validation: "must be one of: new | developing | loyal"
    - field: "field_3_context.semantic_affinity_risk"
      validation: "must be one of: low | medium | high"
    - field: "field_5_inputs (all CRITICAL tier)"
      validation: "all CRITICAL DEP IDs must resolve in Dependency Registry v4.0"
    - field: "field_9_voice_constraints.coach_specific.forbidden_vocabulary"
      validation: "must be non-empty array loaded from DEP-ENG-004. Reject empty array."
    # v1.2 additions:
    - field: "field_3_context.cral_session_id"
      validation: >
        Must be populated if DEP-ENG-021 is present. If CRAL session
        was not run, set cral_coverage_status = ABSENT and proceed
        with v1.1 source chain. Do not block — flag CRAL_DEGRADED.
    - field: "field_3_context.cral_coverage_status"
      validation: "must be one of: COMPLETE | PARTIAL | ABSENT"

  dep_registry_checks:
    - "DEP-ENG-003 status must be populated (not draft)"
    - "DEP-ENG-006 must contain L3 layer with minimum 10% of total insights"
    - "DEP-ENG-010 must contain at least one passage tagged as Achievement Story candidate"
    - "DEP-ENG-005 Authentication Certificate must exist and pass LIWC-22 gate"
    - "DEP-ENG-016 must be populated — REGISTERED in v4.0, no longer PROPOSED"
    # v1.2 additions:
    - "DEP-ENG-021 should be present and contain ≥5 of 7 moment findings for COMPLETE status"
    - "DEP-ENG-022 should be present if DEP-ENG-021 is present"

  semantic_affinity_pre_check:
    rule: >
      If semantic_affinity_risk = high AND mood_state = Escape:
      BLOCK compilation.
      Return: {"status": "blocked", "reason": "affinity_mode_conflict",
      "instruction": "Reclassify mood_state to Processing or swap content domain."}
    protocol_ref: "DEP-PROTO-011 — REGISTERED"

  tmt_cohort_check:
    rule: >
      If tmt_function = worldview_construction AND audience_cohort != loyal:
      DOWNGRADE tmt_function to insight_delivery.
      Log: "worldview_construction downgraded — cohort not loyal."

  # v1.2 ADDITION ─────────────────────────────────────────────
  builder_engine_step_3_5:
    description: >
      Research Synthesis Protocol conflict detection pass.
      Runs between Builder Engine Step 3 (dependency resolution)
      and Step 4 (template selection).
    rule: >
      When M2_BELIEVABLE and M6_IRREFUTABLE arrive from different
      source types and produce apparently contradictory mechanism
      evidence: resolve using source proximity hierarchy.
      M6 internal institutional evidence outranks M2 external
      documentary evidence when they conflict.
      If neither outranks the other by proximity: FLAG for coach
      review before compilation continues.
    conflict_types:
      - "M2 external document vs. M6 internal document — same mechanism, contradictory claims"
      - "M4 narrative unit mechanism vs. DEP-ENG-010 SoC mechanism — structural mismatch"
      - "M6 irrefutable evidence vs. DEP-ENG-005 Authentication Certificate — result authenticity conflict"
    resolution_log: >
      All Step 3.5 decisions logged in assembly_report.json under
      key: cral_conflict_resolution[]
  # ────────────────────────────────────────────────────────────

  # v1.2 ADDITION ─────────────────────────────────────────────
  cral_coverage_check:
    id: "C-09"
    rule: >
      DEP-ENG-021 must be present with ≥5 of 7 moment findings
      for cral_coverage_status = COMPLETE.
      3–4 findings = PARTIAL — assembly proceeds, degraded phases flagged.
      <3 findings or absent = ABSENT — full v1.1 source chain fallback,
      CRAL_DEGRADED logged on output, operator alert triggered.
    critical_moments: >
      M2_BELIEVABLE and M7_RELATABLE are the highest-impact moments
      for this archetype. If either is absent, flag at HIGH severity
      regardless of overall coverage count.

  cral_moment_coverage_check:
    id: "C-10"
    rule: >
      Verify each moment finding in DEP-ENG-021 contains all four
      required fields: finding, register, use_at, verifiability_citation.
      A finding object with missing fields is treated as absent for
      its assigned arc phase.
  # ────────────────────────────────────────────────────────────

  ttt_enforcement:
    rule: >
      TTT is NOT a field in this brief.
      TTT is populated by DEP-ENG-005 Authentication Certificate
      at runtime. Any attempt to hardcode TTT = ARCHITECTURAL VIOLATION.
    natural_affinity_reference:
      note: "ARCH-STORY-01 natural affinity range: TTT-03 to TTT-06."
      behavior: "warn_not_block if outside range"
      ref: "DEP-WS-001 TTT System v3.0"

  proposed_registrations_reminder:
    # v1.2 update: All v1.1 PROPOSED items now REGISTERED in v4.0.
    # New v1.2 items listed below.
    registered_since_v1_1:
      - "DEP-ENG-016 Psychological Routing Brief — REGISTERED v4.0"
      - "DEP-ENG-017 Audience Maturity Profile — REGISTERED v4.0"
      - "DEP-ENG-018 Mood Context Map — REGISTERED v4.0"
      - "DEP-PROTO-011 Semantic Affinity Guard — REGISTERED v4.0"
      - "psych-routing-adapter — REGISTERED Adapter Registry v2.0"
      - "payload-masking-adapter — REGISTERED Adapter Registry v2.0"
      - "audience-maturity-adapter — REGISTERED Adapter Registry v2.0"
    registered_new_in_v1_2:
      - "DEP-ENG-021 CRAL Finding Index — REGISTERED v4.0"
      - "DEP-ENG-022 CRAL Session Research Plan — REGISTERED v4.0"
      - "cral-finding-router-adapter — REGISTERED Adapter Registry v2.0"
    still_pending:
      - "DEP-LIB-008 Archetype Classification Library — PENDING v4.0 registration"
      - "DEP-LIB-009 Skill Template Registry — PENDING v4.0 registration"
      - "Standing Trigger Intelligence library per coach — PENDING Phase 5 build"

# ═══════════════════════════════════════════════════════════
# MIGRATION REFERENCE — v1.1 → v1.2 COMPLETE DELTA
# For use when upgrading the remaining 91 archetype templates
# ═══════════════════════════════════════════════════════════

migration_guide_for_other_archetypes:
  description: >
    This section documents the pattern for upgrading any other
    archetype Design Brief Template from v1.1 to v1.2.
    The Achievement Story upgrade is the migration standard.
    Apply this pattern to all 91 remaining archetypes.

  step_1_meta: >
    Update template_version to "1.2".
    Add migration_from: "1.1" and cral_integration: true.
    Add migration_delta_ref pointing to this file.

  step_2_field_7_arc_phases: >
    For each arc phase: add cral_source field naming which CRAL
    moment finding(s) pre-address intelligence for that phase.
    Add v1_1_source (what the phase used before) and
    v1_2_source (what it uses now) for auditability.
    Add one universal structural law: "CRAL moments are pre-addressed.
    The Assembler calls DEP-ENG-021[moment_id] at phase entry."

  step_3_field_8_distillation_funnel: >
    Update Cross-Input Collision from DEP-ENG-003 ↔ DEP-ENG-006
    to DEP-ENG-021 (CRAL) ↔ DEP-ENG-003 (Voice).
    Add cral-finding-router-adapter as mandatory.
    Add CRAL-specific critic rules to MCDA module.

  step_4_field_9_constraints: >
    Add three universal CRAL rules to universal_rules list.
    Add DEP-ENG-021 and each moment finding to
    graceful_degradation_map with CRITICAL-degraded criticality.

  step_5_field_11_structural_gates: >
    Add SG-06 (M2 deployed in primary evidence phase).
    Add SG-07 (M7 passes tribal recognition test).
    Add SG-08 (Builder Engine Step 3.5 conflict resolved).
    Adjust phase labels for the specific archetype's arc structure.

  step_6_block_b_inputs: >
    Add DEP-ENG-021 to tier_2_orchestration as CRITICAL.
    Add DEP-ENG-022 to tier_3_archive as IMPORTANT.
    Add cral_session_id, cral_finding_index_ref,
    cral_coverage_status, cral_degraded_phases to field_3_context.

  step_7_field_5b_cral_finding_map: >
    Add field_5b with full CRAL finding map for this archetype.
    Map each of the 7 moments to the archetype's specific arc phases.
    Moment-to-phase mapping will differ per archetype family:
    - Storytelling archetypes: map as Achievement Story above
    - Myth Debunking: M2→Myth establishment, M6→Origin exposure, M7→Tribal belief anchor
    - Fear-Anxiety: M3→Fear confirmation, M5→Hidden cost reveal, M6→System evidence
    - Status archetypes: M4→Status peer story, M7→Insider tribal reference
    Document the archetype-specific logic in field_5b for each template.

  step_8_block_c_gates: >
    Add Builder Engine Step 3.5 block.
    Add C-09 CRAL Coverage Check.
    Add C-10 CRAL Moment Coverage Check.
    Update proposed_registrations_reminder with registered and pending lists.
    Promote all three psychological adapters from PROPOSED to REGISTERED.
